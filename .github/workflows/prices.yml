# LonelyCase — цены Standoff 2 и CS2. Каждые 30 минут обновляет цены и выкладывает их
# в ветку data этого репозитория. Приложение читает:
# https://raw.githubusercontent.com/<владелец>/<репозиторий>/data/so2prices.json  (Standoff 2)
# https://raw.githubusercontent.com/<владелец>/<репозиторий>/data/cs2market.json  (CS2, Skinport)
name: Prices Standoff 2

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # чтобы запуск сам запускал следующий

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Взять прошлое состояние из ветки data
        run: |
          if git clone -q --depth 1 -b data "https://github.com/${{ github.repository }}.git" /tmp/prev 2>/dev/null; then
            cp /tmp/prev/state.json . 2>/dev/null || true
            [ -d /tmp/prev/hist ] && cp -r /tmp/prev/hist . || true
            cp /tmp/prev/cs2meta.json . 2>/dev/null || true
            [ -d /tmp/prev/cs2hist ] && cp -r /tmp/prev/cs2hist . || true
            echo "✓ прошлое состояние: $(ls hist 2>/dev/null | wc -l) графиков SO2, $(ls cs2hist 2>/dev/null | wc -l) файлов графиков CS2"
          else
            echo "• ветки data ещё нет — первый запуск"
          fi

      - name: Цены CS2 (Skinport)
        continue-on-error: true
        timeout-minutes: 4
        run: node cs2bot.js

      - name: Скачать цены Standoff 2
        run: node pricebot.js

      - name: Выложить в ветку data
        run: |
          [ -f so2prices.json ] || { echo "• файла цен нет — нечего выкладывать"; exit 0; }
          mkdir -p /tmp/out && cp so2prices.json state.json /tmp/out/
          [ -d hist ] && cp -r hist /tmp/out/ || true
          for f in cs2market.json cs2meta.json; do [ -f $f ] && cp $f /tmp/out/; done
          [ -d cs2hist ] && cp -r cs2hist /tmp/out/ || true
          cd /tmp/out
          git init -q -b data
          git config user.name "prices-bot"
          git config user.email "prices-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Цены $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          echo "✓ выложено: https://raw.githubusercontent.com/${{ github.repository }}/data/so2prices.json"

      - name: Запустить следующий круг
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub часто пропускает запуски по расписанию в новых репозиториях,
          # поэтому каждый запуск сам запускает следующий (расписание остаётся запасным)
          gh workflow run prices.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" \
            && echo "✓ следующий запуск поставлен в очередь" || echo "• не удалось поставить следующий запуск"
